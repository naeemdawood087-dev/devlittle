<style>

.pb{background:linear-gradient(135deg,#8067ef,#674bdc);color:#fff;border:0;border-radius:13px;padding:12px 20px;font-weight:700;box-shadow:0 7px 16px #7458e847}
.pb:hover{transform:translateY(-2px)}.pb:disabled{opacity:.5}
.gb{background:var(--lav);color:var(--pu);border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.hero{background:linear-gradient(112deg,#efebff,#e3e1ff);border-radius:24px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:16px;overflow:hidden}

.stat{display:flex;gap:10px;align-items:center}.stat span{font-size:26px}.stat b{font:600 20px Fredoka;display:block}.stat small{color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 260px;gap:16px}

.lc{background:#fff;border:1px solid var(--ln);border-radius:18px;overflow:hidden;transition:.2s}.lc:hover{transform:translateY(-4px);box-shadow:0 13px 29px #443c7414}
.art{height:110px;display:grid;place-items:center;font-size:62px;cursor:pointer;position:relative}
.art i{position:absolute;top:8px;left:8px;font:800 9px "DM Sans";font-style:normal;background:#ffffffcf;border-radius:8px;padding:4px 8px}
.m{background:#ffeab5}.r{background:#cdeedd}.s{background:#cfe6ff}.a{background:#ffd9e2}
.li{padding:12px}.li h3{font-size:16px}.li small{color:var(--mut);font-size:11px}
.bar{height:7px;background:#f0eef6;border-radius:9px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:linear-gradient(90deg,#8b73f3,#b09cff);transition:width .4s}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side{display:grid;gap:12px;align-content:start}
.ring{width:70px;height:70px;border-radius:50%;display:grid;place-items:center}.ring div{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font:600 15px Fredoka;color:var(--pu)}
.wk{display:flex;justify-content:space-between;margin-top:10px}.wk div{text-align:center;font-size:10px;color:var(--mut)}
.dot{width:22px;height:22px;border-radius:7px;border:1px solid #efdcae;display:grid;place-items:center;margin:0 auto 3px;font-size:11px}
.dot.on{background:#ffbd52;color:#fff;border-color:#ffb74e}.dot.td{border-color:var(--pu)}
.search{width:100%;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bg{position:fixed;inset:0;background:#24203c99;display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}

.opt:hover{border-color:#c4b8ff;background:#f7f5ff}.opt.ok{border-color:#8dd9b7;background:#edfbf4;color:#24875f}.opt.no{border-color:#ffb5a9;background:#fff2ef;color:#b45244}
.fb{min-height:24px;font-weight:700;color:#6d6881;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#292542;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:13px;z-index:50;text-align:center;max-width:90vw}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f2efff,#fff5f0)}

.av{display:flex;justify-content:center;gap:8px;margin:12px 0 18px}.av button{border:2px solid transparent;background:#f5f2fb;border-radius:14px;width:46px;height:46px;font-size:24px}.av .sel{border-color:#8b73f3;background:#eeebff}

@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:20px}.big{font-size:60px}}

</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React, h=React.createElement;
/* ---------- helpers ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, P=a=>a[R(0,a.length-1)];
const S=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const ld=(k,d=null)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const gap=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);

const lvl=e=>Math.floor(e/200)+1;
let AC=null,SND=true;

/* ---------- question generators (infinite) ---------- */
const opts=(ans,wrong)=>({options:S([ans,...[...new Set(wrong.filter(x=>x!==ans))].slice(0,2)]),answer:ans});
const numQ=(question,ans)=>{const w=new Set();while(w.size<2){const x=ans+R(-4,4);if(x!==ans&&x>=0)w.add(String(x))}return{question,...opts(String(ans),[...w])}};
const CAT={animal:["🐶 Dog","🐱 Cat","🐘 Elephant","🦁 Lion","🐟 Fish","🐰 Rabbit","🐸 Frog","🐵 Monkey"],fruit:["🍎 Apple","🍌 Banana","🍇 Grapes","🍓 Strawberry","🍊 Orange","🍉 Watermelon"],vehicle:["🚗 Car","🚌 Bus","🚂 Train","✈️ Airplane","🚲 Bicycle","🚢 Ship"],thing:["⚽ Ball","📚 Book","🪑 Chair","🧦 Sock","🔑 Key","🥄 Spoon"]};
const CL={animal:"an animal",fruit:"a fruit",vehicle:"a vehicle",thing:"a thing you can hold"};

const MIX=[["Red","Blue","Purple"],["Blue","Yellow","Green"],["Red","Yellow","Orange"],["Red","White","Pink"],["Black","White","Gray"]];
const COL=[["banana","Yellow"],["grass","Green"],["sky","Blue"],["tomato","Red"],["snow","White"],["carrot","Orange"],["night sky","Black"],["grapes","Purple"]];
const ALLC=["Red","Blue","Yellow","Green","Orange","Purple","Pink","Gray","White","Black"];
const SH=[["Triangle",3],["Square",4],["Pentagon",5],["Hexagon",6]];
const GEN={
Math:l=>{const m=Math.min(9+l,150),t=R(1,l>25?7:6);
 if(t==1){const a=R(1,m),b=R(1,m);return numQ(`What is ${a} + ${b}?`,a+b)}
 if(t==2){const a=R(3,m),b=R(1,a);return numQ(`What is ${a} − ${b}?`,a-b)}
 if(t==3){const n=R(1,m);return R(0,1)?numQ(`Which number comes after ${n}?`,n+1):numQ(`Which number comes before ${n+1}?`,n)}
 if(t==4){const n=R(1,Math.min(4+Math.floor(l/4),12));return numQ(`How many? ${P(["🍎","⭐","🐟","🎈","🍪"]).repeat(n)}`,n)}
 if(t==5){const s=new Set();while(s.size<3)s.add(R(1,m));const a=[...s],b=R(0,1),ans=b?Math.max(...a):Math.min(...a);return{question:`Which number is the ${b?"biggest":"smallest"}?`,...opts(String(ans),a.map(String))}}
 if(t==6){const[n,s]=P(SH);return numQ(`How many sides does a ${n} have?`,s)}
 const a=R(2,2+Math.floor(l/10)),b=R(2,5+Math.floor(l/10));return numQ(`What is ${a} × ${b}?`,a*b)},
Words:l=>{const t=R(1,4);
 if(t==1){const f=P(RH),w=P(f),a=P(f.filter(x=>x!==w));return{question:`Which word rhymes with "${w}"?`,...opts(a,S(RH.filter(x=>x!==f).flat()).slice(0,2))}}
 if(t==2){const p=P(OPP),[x,y]=R(0,1)?p:[p[1],p[0]];return{question:`What is the opposite of "${x}"?`,...opts(y,S(OPP.flat().filter(z=>!p.includes(z))).slice(0,2))}}
 if(t==3){const it=P(Object.values(CAT).flat()),w=it.split(" ")[1],L=w[0].toUpperCase();return{question:`Which letter does "${w}" start with?`,...opts(L,S("ABCDEFGHIJKLMNOPRSTW".split("").filter(c=>c!==L)).slice(0,2))}}
 return catQ(P(["animal","fruit","vehicle"]))},
Science:l=>{const t=R(1,4);
 if(t<=2){const[q,a,w]=P(F);return{question:q,...opts(a,w)}}
 if(t==3){const[s,a]=P(SN);return{question:`Which animal ${s}?`,...opts(a,S(SN.map(x=>x[1]).filter(x=>x!==a)).slice(0,2))}}
 return catQ(P(["animal","fruit","vehicle"]))},
Art:l=>{const t=R(1,4);
 if(t==1){const[a,b,c]=P(MIX),[x,y]=R(0,1)?[a,b]:[b,a];return{question:`Which color do you get by mixing ${x} and ${y}?`,...opts(c,S(ALLC.filter(z=>z!==c)).slice(0,2))}}
 if(t==2){const[o,c]=P(COL);return{question:`What color is ${/^[aeiou]/.test(o)?"an":"a"} ${o}?`,...opts(c,S(ALLC.filter(z=>z!==c)).slice(0,2))}}
 if(t==3){const[n,s]=P(SH);return{question:`Which shape has ${s} sides?`,...opts(n,S(SH.map(x=>x[0]).filter(x=>x!==n)).slice(0,2))}}
 return{question:"Which one is a color?",...opts(P(ALLC),S(Object.values(CAT).flat()).slice(0,2))}}
};
const makeTask=(id,n)=>{const out=[],seen=new Set();let g=0;while(out.length<10&&g++<300){const q=GEN[id](n);if(!seen.has(q.question)||g>200){seen.add(q.question);out.push(q)}}return out};
const LESSONS=[{id:"Math",title:"Number Galaxy",e:"🚀",tag:"MATH MAGIC",c:"m"},{id:"Words",title:"The Word Garden",e:"🦊",tag:"STORY TIME",c:"r"},{id:"Science",title:"Tiny Scientists",e:"🐙",tag:"WOW, SCIENCE!",c:"s"},{id:"Art",title:"Rainbow Art Club",e:"🦄",tag:"MAKE & CREATE",c:"a"}];
const FREE=["🦊","🐱","🐻","🐰"],SHOP=[["🦁",100],["🐵",150],["🐼",200],["🦄",300],["🐸",350],["🐲",500]];
const BADGES=[["🌟","First Task","Finish 1 task",s=>s.total>=1],["🔟","10 Tasks","Finish 10 tasks",s=>s.total>=10],["💯","Perfect!","Get 10/10 in a task",s=>s.perfect>=1],["🔥","3-Day Streak","Learn 3 days in a row",s=>s.best>=3],["🚀","7-Day Streak","Learn 7 days in a row",s=>s.best>=7],["⭐","500 Stars","Earn 500 stars",s=>s.earned>=500],["🏆","Lesson Master","Finish 100 tasks in one lesson",s=>Object.values(s.tasks).some(v=>v>=100)]];

/* ---------- components ---------- */
function Confetti(){const items=useRef(Array.from({length:40},(_,i)=>({e:P(["⭐","✨","🎉","🌟","💜"]),l:R(0,98),d:Math.random()*1.2,s:R(16,30)}))).current;
 return h("div",{className:"cf"},items.map((c,i)=>h("span",{key:i,style:{left:c.l+"%",animationDelay:c.d+"s",fontSize:c.s}},c.e)))}

function Login({onGo}){
 const [name,setName]=useState(""),[av,setAv]=useState("🦊"),[err,setErr]=useState("");
 const go=e=>{e.preventDefault();const n=name.trim().replace(/\s+/g," ");if(!n){setErr("Type your name first, little explorer!");return}const p={name:n,avatar:av};sv("ll.profile",p);beep([523,659,784],.2);onGo(p)};
 return h("div",{className:"login"},h("form",{className:"lcard",onSubmit:go},
  h("div",{style:{fontSize:64}},av),h("h1",null,"Who's exploring today?"),
  h("p",{style:{color:"#85839d",fontSize:13}},"Pick a character and type your name!"),
  h("input",{value:name,maxLength:20,placeholder:"Type your name here...",onChange:e=>{setName(e.target.value);setErr("")}}),
  h("div",{style:{color:"#d66e61",fontSize:12,minHeight:16}},err),
  h("div",{className:"av"},FREE.map(a=>h("button",{type:"button",key:a,className:a===av?"sel":"",onClick:()=>{setAv(a);beep([660],.1)}},a))),
  h("button",{className:"pb",style:{width:"100%"}},"Let's explore! →"),
  h("p",{style:{fontSize:10,color:"#9a97a9"}},"Grown-up note: progress is saved only on this device. A new name starts a new profile.")))}

function Quiz({lesson,n,prof,onFinish,onExit}){
 const [qs]=useState(()=>makeTask(lesson.id,n));
 const [i,setI]=useState(0),[pick,setPick]=useState(null),[tried,setTried]=useState([]),[combo,setCombo]=useState(0),[ok,setOk]=useState(0),[earn,setEarn]=useState(0),[an,setAn]=useState({k:0,t:""}),[msg,setMsg]=useState("");
 const q=qs[i],tm=useRef();useEffect(()=>()=>clearTimeout(tm.current),[]);

  if(o===q.answer){

 };
 return h("div",{className:"wrap"},h("div",{className:"qwrap"},
  h("div",{className:"row"},h("button",{className:"gb",onClick:onExit},"← Back"),h("b",null,lesson.title+" · Task "+(n)+"/100"),h("span",{className:"chip"},"⭐ "+earn)),
  h("div",{className:"bar",style:{height:12,marginTop:14}},h("div",{style:{width:(i+(pick!==null?1:0))/10*100+"%"}})),
  h("small",{style:{color:"#85839d"}},`Question ${i+1} of 10`),
  h("div",null,h("span",{key:an.k,className:"mascot "+an.t},prof.avatar)),
  h("div",{className:"qcard"},h("h2",null,q.question),

function Summary({res,lesson,onNext,onStop}){
 useEffect(()=>{beep([659,784,1047],.3);const t=setTimeout(onNext,4500);return()=>clearTimeout(t)},[]);
 return h("div",{className:"wrap"},h(Confetti),h("div",{className:"qwrap card",style:{marginTop:30}},
  h("div",{style:{fontSize:70}},res.perfect?"🏆":"🎉"),h("h1",null,res.perfect?"Perfect score!":"Task complete!"),

function Modal({title,onClose,children}){return h("div",{className:"bg",onClick:e=>e.target===e.currentTarget&&onClose()},h("div",{className:"modal"},h("button",{className:"x",onClick:onClose,"aria-label":"Close"},"✕"),h("h2",null,title),children))}

function Home({prof,setProf}){
 const key="ll.u."+prof.name.toLowerCase();
 const [s,setS]=useState(()=>({...D,...ld(key)}));
 const [quiz,setQuiz]=useState(null),[sum,setSum]=useState(null),[modal,setModal]=useState(null),[toast,setToast]=useState(""),[find,setFind]=useState(""),[snd,setSnd]=useState(SND),[,force]=useState(0);
